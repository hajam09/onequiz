{% extends 'accounts/base.html' %}
{% load static %}
{% load templateTags %}
{% block content %}
    <style>
        .CWQk3-custom-checkbox > input {
            height: 34px;
            width: 34px;
        }
        .CWQk3-custom-checkbox > label {
            padding-top: 10px;
            padding-left: 30px;
        }
    </style>
    <div class='container mt-5'>
        <div class='row'>
            <div class='col-lg-4 mb-4'>
                {% include 'accounts/components/settings-panel.html' %}
            </div>

            <div class='col-lg-8'>
                <div class='card' id='idCardWideComponent'>
                    <form method='post'>
                        {% csrf_token %}
                        <div class='card-body'>
                            <h4 class='heading-h2'>Notification Settings</h4>
                            <p class='text-muted'>Choose the updates you want to receive by email.</p>
                            <hr>

                            <div class='form-check mb-3 CWQk3-custom-checkbox'>
                                <input
                                        type='checkbox'
                                        class='form-check-input'
                                        id='emailOnQuizAttemptSubmitted'
                                        name='emailOnQuizAttemptSubmitted'
                                        {% if notificationSettings.emailOnQuizAttemptSubmitted %}checked{% endif %}
                                >
                                <label class='form-check-label' for='emailOnQuizAttemptSubmitted'>
                                    Notify me when my quiz attempt is submitted
                                </label>
                            </div>

                            <div class='form-check mb-3 CWQk3-custom-checkbox'>
                                <input
                                        type='checkbox'
                                        class='form-check-input'
                                        id='emailOnQuizMarked'
                                        name='emailOnQuizMarked'
                                        {% if notificationSettings.emailOnQuizMarked %}checked{% endif %}
                                >
                                <label class='form-check-label' for='emailOnQuizMarked'>
                                    Notify me when my quiz is marked
                                </label>
                            </div>

                            <div class='form-check mb-3 CWQk3-custom-checkbox'>
                                <input
                                        type='checkbox'
                                        class='form-check-input'
                                        id='emailOnPasswordChanged'
                                        name='emailOnPasswordChanged'
                                        {% if notificationSettings.emailOnPasswordChanged %}checked{% endif %}
                                >
                                <label class='form-check-label' for='emailOnPasswordChanged'>
                                    Notify me when my password is changed
                                </label>
                            </div>

                            <div class='form-check mb-3 CWQk3-custom-checkbox'>
                                <input
                                        type='checkbox'
                                        class='form-check-input'
                                        id='emailOnAccountSecurityUpdate'
                                        name='emailOnAccountSecurityUpdate'
                                        {% if notificationSettings.emailOnAccountSecurityUpdate %}checked{% endif %}
                                >
                                <label class='form-check-label' for='emailOnAccountSecurityUpdate'>
                                    Notify me about account security updates
                                </label>
                            </div>

                            <div class='form-check mb-3 CWQk3-custom-checkbox'>
                                <input
                                        type='checkbox'
                                        class='form-check-input'
                                        id='emailOnProductUpdates'
                                        name='emailOnProductUpdates'
                                        {% if notificationSettings.emailOnProductUpdates %}checked{% endif %}
                                >
                                <label class='form-check-label' for='emailOnProductUpdates'>
                                    Send me product and feature updates
                                </label>
                            </div>

                            <div class='row'>
                                <div class='col text-right'>
                                    <input type='submit' class='btn btn-primary' value='Save'>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
